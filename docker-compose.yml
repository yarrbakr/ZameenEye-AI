# ZameenEye AI — full app: TS backend + Python voice service.
# Supabase Postgres is external (cloud), so there is NO database container here.
#
# Secrets come from the root .env (env_file below) — never baked into the images.
#
# Live WhatsApp still needs a PUBLIC HTTPS URL in front of the voice service (:8000):
#   ngrok http 8000  ->  register the https URL + WHATSAPP_VERIFY_TOKEN in the Meta dashboard.
#
#   docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env                 # DATABASE_URL (Supabase Session Pooler), PORT, ...
    ports:
      - "3000:3000"
    restart: unless-stopped

  voice:
    build:
      context: .
      dockerfile: Dockerfile.voice
    env_file: .env                 # FIREWORKS/MISTRAL keys, WHATSAPP_*, WHISPER_*, PHONE_LAND_MAP
    environment:
      # Reach the backend over the compose network (overrides any localhost in .env).
      SPATIAL_CHECK_URL: http://backend:3000/spatial-check
    ports:
      - "8000:8000"
    depends_on:
      - backend
    restart: unless-stopped
